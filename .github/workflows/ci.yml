name: CI

on:
  push:
    branches: [claude/beautiful-faraday-1RWJP, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm run build
      - run: npm test
      # e2e is skipped until a postgres service container is wired.
      # See backend/test/README.md.
      - name: e2e (skipped)
        env:
          SKIP_E2E: '1'
        run: npm run test:e2e

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze --no-fatal-infos
      - working-directory: mobile
        run: flutter test --platform vm
