name: quran_tasmee3
description: Quran Tasmee3 — voice-driven Quran memorization (Phase 1).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  dio: ^5.4.0
  path_provider: ^2.1.2
  path: ^1.9.0
  record: ^5.1.2
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  # The Uthmani Hafs font is license-restricted and not committed.
  # Drop UthmanicHafs1Ver18.ttf into assets/fonts/ (see
  # assets/fonts/README.md) and uncomment the block below to enable
  # it. Without the file, the app falls back to the system Arabic
  # font — the build still succeeds, and CI does not need the asset.
  #
  # fonts:
  #   - family: UthmaniHafs
  #     fonts:
  #       - asset: assets/fonts/UthmanicHafs1Ver18.ttf
